<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quaderno di parole</title>
<!-- bump on every change: the installed app compares this with the online copy to update itself -->
<meta name="app-version" content="2026-11-08.2">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quaderno">
<meta name="theme-color" content="#FAFBFD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app — sticky header, one scrolling view, fixed tab bar. Light = Italian squared exercise book, dark = school blackboard. */
:root{
  --paper:#FAFBFD; --surface:#FFFFFF; --grid:rgba(60,110,200,.11);
  --ink:#1C3A8A; --text:#1E2433; --muted:#626B80; --line:#DCE2EE;
  --margin:#D2382A; --ok:#1F7A4D; --okbg:#E4F3EA; --kobg:#FBE7E4;
  --masc:#1C5FC9; --fem:#C2364F;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --ui:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1C2623; --surface:#24302C; --grid:rgba(235,240,230,.05);
  --ink:#F1EFDF; --text:#E6E8E1; --muted:#9DA8A2; --line:#35433E;
  --margin:#F2897C; --ok:#8FD6A9; --okbg:#2B3D34; --kobg:#45302C;
  --masc:#9CC3F2; --fem:#F2A0B0; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1C2623; --surface:#24302C; --grid:rgba(235,240,230,.05);
  --ink:#F1EFDF; --text:#E6E8E1; --muted:#9DA8A2; --line:#35433E;
  --margin:#F2897C; --ok:#8FD6A9; --okbg:#2B3D34; --kobg:#45302C;
  --masc:#9CC3F2; --fem:#F2A0B0; color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--ui);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0;color:var(--ink);letter-spacing:-.01em}
.score{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.score b{color:var(--text);font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px;width:120px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--ok);width:0}
main{padding-top:16px}
.view{display:flex;flex-direction:column;gap:14px}

/* controls */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search]{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
select{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.9rem;border:0;background:none;color:var(--muted);padding:10px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
label.check{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--margin);outline-offset:2px}

/* flashcard: a page of squared paper with a red margin */
.card{position:relative;min-height:300px;border-radius:14px;border:1px solid var(--line);background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:32px 20px 32px 44px;cursor:pointer;user-select:none}
.card::before{content:"";position:absolute;top:0;bottom:0;left:28px;width:2px;background:var(--margin);opacity:.55}
.cat{position:absolute;top:12px;left:44px;right:56px;text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.word{font-family:var(--display);font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.15;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere}
.art-m{color:var(--masc)} .art-f{color:var(--fem)}
.answer{margin-top:18px;font-size:1.25rem;color:var(--text);text-wrap:balance;overflow-wrap:anywhere}
.hint{margin-top:18px;font-size:.85rem;color:var(--muted)}
.speak{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;cursor:pointer;display:grid;place-items:center}
.speak svg{width:18px;height:18px}
.knownmark{position:absolute;bottom:12px;right:14px;font-size:.75rem;color:var(--ok)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;font-size:1rem;border-radius:12px;padding:14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.btn.yes{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn:disabled{opacity:.4}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.done{text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:14px}
.done h2{font-family:var(--display);color:var(--ink);margin:0 0 8px}
.link{font:inherit;background:none;border:0;color:var(--margin);font-weight:600;cursor:pointer;padding:6px}

/* categories */
.catlist{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:14px 2px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .nm{font-family:var(--display);font-size:1.15rem;color:var(--ink)}
summary .ct{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
summary .bar{grid-column:1/-1;width:100%;margin:0}
.sub h3{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px dotted var(--line);font-size:.95rem;align-items:baseline}
.wl li .it{font-weight:500;overflow-wrap:anywhere} .wl li .de{color:var(--muted);overflow-wrap:anywhere}
.wl li .k{color:var(--ok);font-size:.8rem}
.study{margin:6px 0 14px}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{font:inherit;font-size:.78rem;background:none;border:0;color:var(--muted);padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.empty{color:var(--muted);font-size:.95rem;padding:8px 0}
.ver{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.dock>div{pointer-events:auto;width:100%;max-width:528px;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--paper);border-radius:12px;padding:6px 6px 6px 14px;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.dock>div[hidden]{display:none}
.dock span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock button{flex:none;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--paper);color:var(--ink);padding:8px 12px;cursor:pointer}
.card.hold-yes{background-color:var(--okbg);border-color:var(--ok);color:var(--ok)}
.card.hold-no{background-color:var(--kobg);border-color:var(--margin);color:var(--margin)}
.card .tick{position:absolute;left:0;bottom:0;height:3px;width:100%;background:currentColor;transform-origin:left;animation:tick 1s linear forwards}
@keyframes tick{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:no-preference){.dock>div:not([hidden]){animation:rise .18s ease-out}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* sfida: endless test on known words, ends at the first mistake */
.lead{margin:0;color:var(--muted);font-size:.95rem;line-height:1.45}
.lead b{color:var(--text)}
.tog{font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);padding:9px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tog svg{width:18px;height:18px}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.btn.big{padding:16px;font-size:1.1rem}
.sec{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px;font-weight:600}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px}
.streak{font-family:var(--display);font-weight:600;font-size:2.4rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.streak small{font-family:var(--ui);font-weight:400;font-size:.82rem;color:var(--muted);margin-left:6px}
.hud .r{display:flex;align-items:center;gap:10px}
.clock{font-variant-numeric:tabular-nums;color:var(--muted)}
.ico{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.ico svg{width:18px;height:18px}
.ico[aria-pressed="true"]{color:var(--ink)}
.card.test{cursor:default;min-height:200px;user-select:text}
.card.ko{background-color:var(--kobg);border-color:var(--margin)}
.given{margin-top:8px;font-size:.95rem;color:var(--margin);text-decoration:line-through;overflow-wrap:anywhere}
.ansrow{display:flex;gap:8px}
.ans{flex:1;min-width:0;font:inherit;font-size:18px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.mic{flex:none;width:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.mic svg{width:22px;height:22px}
.mic[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mic.live{box-shadow:0 0 0 3px var(--margin)}
.heard{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;align-self:center}
.result{text-align:center}
.result h2{font-family:var(--display);color:var(--ink);margin:0 0 6px;font-size:1.6rem}
.result p{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.result p b{color:var(--text)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;padding:9px 8px;border-top:1px dotted var(--line);align-items:baseline;border-radius:8px}
.rank .pos{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.rank .pts{font-family:var(--display);font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.rank .pts small{font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-left:5px}
.rank .dir{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.rank .det{grid-column:2/-1;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rank li.new{background:var(--okbg)}
@keyframes okf{from{background-color:var(--okbg);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}}
@keyframes kof{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(1.2)}}
.card.ok{animation:okf .35s ease-out}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:active{transform:scale(.99)}.card.ko{animation:kof .22s ease-in-out}.streak .pop{display:inline-block;animation:pop .2s ease-out}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Quaderno</h1>
    <div><div class="score"><b id="kn">0</b> / <span id="tot">0</span> sapute <span id="kdir"></span></div><div class="bar"><i id="kbar"></i></div></div>
  </header>
  <main>
    <section class="view" id="v-impara">
      <div class="row">
        <select id="selCat" aria-label="Categoria"></select>
        <div class="seg" role="group" aria-label="Direzione">
          <button id="dirIt" data-dir="it" aria-pressed="true">IT → DE</button>
          <button id="dirDe" data-dir="de" aria-pressed="false">DE → IT</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="incKnown"> Ripassa anche le parole già sapute</label>
      <div id="stage"></div>
      <div class="meta"><span id="left"></span><button class="link" id="reshuffle">Mescola di nuovo</button></div>
    </section>

    <section class="view" id="v-categorie" hidden>
      <div class="catlist" id="catlist"></div>
      <button class="link" id="reset" style="align-self:flex-start">Azzera i progressi</button>
      <div id="resetConfirm" hidden class="row"><span class="empty">Cancellare tutti i progressi?</span><button class="btn" id="resetYes">Sì, azzera</button><button class="btn" id="resetNo">No</button></div>
      <div class="ver"><span id="verMsg"></span><button class="link" id="verCheck">Controlla aggiornamenti</button></div>
    </section>

    <section class="view" id="v-cerca" hidden>
      <input type="search" id="q" placeholder="Cerca in italiano o tedesco…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Cerca">
      <ul class="wl" id="res"></ul>
    </section>

    <section class="view" id="v-sfida" hidden>
      <div class="view" id="sfIntro">
        <p class="lead" id="sfLead"></p>
        <div class="row">
          <div class="seg" role="group" aria-label="Direzione">
            <button data-dir="it" aria-pressed="true">IT → DE</button>
            <button data-dir="de" aria-pressed="false">DE → IT</button>
          </div>
        </div>
        <div class="row">
          <button class="tog" id="sfSnd" aria-pressed="true"></button>
          <button class="tog" id="sfVoice" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Rispondi a voce</button>
        </div>
        <button class="btn yes big" id="sfStart">Inizia</button>
        <h3 class="sec">Classifica</h3>
        <ol class="rank" id="sfRank"></ol>
        <button class="link" id="sfClear" style="align-self:flex-start">Azzera classifica</button>
        <div id="sfClearConfirm" hidden class="row"><span class="empty">Cancellare la classifica?</span><button class="btn" id="sfClearYes">Sì, azzera</button><button class="btn" id="sfClearNo">No</button></div>
      </div>

      <div class="view" id="sfRun" hidden>
        <div class="hud">
          <div class="streak"><span id="sfN" aria-live="polite">0</span><small>giuste</small></div>
          <div class="r"><span class="clock" id="sfClock">0:00</span><button class="ico" id="sfSnd2" aria-label="Suoni on/off"></button></div>
        </div>
        <div class="card test" id="sfCard"><div class="cat" id="sfCat"></div><div class="word" id="sfWord"></div><div id="sfFix" hidden></div></div>
        <div class="view" id="sfPlay">
          <div class="ansrow">
            <input class="ans" id="sfIn" type="text" placeholder="Traduzione…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="Risposta">
            <button class="mic" id="sfMic" aria-pressed="false" aria-label="Rispondi a voce" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
          </div>
          <div class="meta"><span class="heard" id="sfHeard"></span><span style="flex:none"><button class="link" id="sfSkip">Non lo so</button><button class="link" id="sfStop">Termina</button></span></div>
        </div>
        <div class="view" id="sfEnd" hidden>
          <div class="result"><h2 id="sfTitle"></h2><p id="sfStats"></p></div>
          <div class="actions" id="sfEndBtns"><button class="btn" id="sfOverride">Era giusta, continua</button><button class="btn yes" id="sfAgain">Ancora</button></div>
          <h3 class="sec">Classifica</h3>
          <ol class="rank" id="sfRank2"></ol>
          <button class="link" id="sfBack" style="align-self:flex-start">← Indietro</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="dock">
  <div id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastBtn">Annulla</button></div>
  <div id="updBar" hidden><span>Nuova versione disponibile</span><button id="updBtn">Aggiorna</button></div>
</div>

<nav aria-label="Sezioni"><div class="in">
  <button data-v="impara" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 5v14"/></svg>Impara</button>
  <button data-v="categorie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>Categorie</button>
  <button data-v="cerca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>Cerca</button>
  <button data-v="sfida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>Sfida</button>

const W = []; // {id,it,de,c,s}
RAW.forEach(([c,subs],ci)=>subs.forEach(([s,ws])=>ws.forEach(([it,de])=>W.push({id:it+'|'+de,it,de,c:ci,s}))));
const CATS = RAW.map(r=>r[0]);
const KEY='quaderno-v1';
let st={known:{},cat:'all',dir:'it',inc:false,sound:true,mic:false};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null'); if(v) st=Object.assign(st,v);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

/* ---- Progress & spaced repetition ----
   Each direction keeps its own record per word: st.srs[dir][id] = [box, dueDay].
   Box 0 = being learned; box ≥ 1 = known, due again on dueDay (local day, rolling over at 4:00).
   "Lo so" on a due word moves it up a box (longer pause); "Ancora" or a wrong Sfida answer
   sends it back to box 0. The legacy st.known map is only read once, for the migration. */
const IV=[0,1,3,7,16,35,80,180];   // days until the next review, by box
const today=()=>{ const d=new Date(Date.now()-4*36e5); return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5); };
if(!st.srs||!st.srs.it||!st.srs.de){
  // words marked before this existed count as known IT → DE, with first reviews spread over the next week
  st.srs={it:{},de:{}}; const t=today();
  Object.keys(st.known||{}).forEach(id=>{ st.srs.it[id]=[2,t+1+Math.floor(Math.random()*7)]; });
  save();
}
const srsOf=(w,dir=st.dir)=>st.srs[dir][w.id];
const isKnown=(w,dir=st.dir)=>{ const r=srsOf(w,dir); return !!r&&r[0]>0; };
const isDue=(w,dir=st.dir,t=today())=>{ const r=srsOf(w,dir); return !!r&&r[0]>0&&r[1]<=t; };
const inDays=n=>n<=0?'oggi':n===1?'domani':'tra '+n+' giorni';
function grade(w,ok,dir=st.dir){
  const m=st.srs[dir], prev=m[w.id]?m[w.id].slice():null, t=today();
  if(!ok) m[w.id]=[0,t];
  else if(!(prev&&prev[0]>0&&prev[1]>t)){   // a known word that is not due yet stays as it is
    // known at first sight → box 2 (3 days); relearned → box 1 (1 day); due review → next box
    const b=!prev?2:prev[0]===0?1:Math.min(prev[0]+1,IV.length-1), d=IV[b];
    m[w.id]=[b,t+(d>=7?Math.round(d*(.9+Math.random()*.2)):d)];
  }
  save(); return prev;
}
function restore(w,prev,dir){ if(prev) st.srs[dir][w.id]=prev; else delete st.srs[dir][w.id]; save(); }
const $=id=>document.getElementById(id);
const esc=t=>t.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtIt(t){
  const m=t.match(/^(il|lo|i|gli|un|uno) (.*)$/), f=t.match(/^(la|le|una) (.*)$/);
  if(m) return '<span class="art-m">'+m[1]+'</span> '+esc(m[2]);
  if(f) return '<span class="art-f">'+f[1]+'</span> '+esc(f[2]);
  return esc(t);
}
const voiceOK='speechSynthesis' in window;
function speak(t){ if(!voiceOK) return; try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/…/g,''));u.lang='it-IT';u.rate=.9;
  const v=speechSynthesis.getVoices().find(x=>/^it/i.test(x.lang)); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }

function updateScore(){
  const n=W.filter(w=>isKnown(w)).length;
  $('kn').textContent=n; $('tot').textContent=W.length; $('kbar').style.width=(100*n/W.length)+'%';
  $('kdir').textContent=st.dir==='it'?'IT→DE':'DE→IT';
}

/* ---- Impara ---- */
let queue=[], cur=null, flipped=false, hold=null, undoInfo=null, toastTimer=0, builtAt=0, stale=false;
function pool(){ return W.filter(w=>st.cat==='all'||w.c==+st.cat); }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
// order: reviews due today, then words being (re)learned, then new words; resting known words only on request
function build(){
  const t=today(), due=[], learn=[], fresh=[], rest=[];
  for(const w of pool()){ const r=srsOf(w); (!r?fresh:r[0]===0?learn:r[1]<=t?due:rest).push(w); }
  queue=[...shuffle(due),...shuffle(learn),...shuffle(fresh),...(st.inc?shuffle(rest):[])];
  builtAt=Date.now(); stale=false; next();
}
function next(){ if(hold){ clearTimeout(hold.timer); hold=null; } cur=queue.shift()||null; flipped=false; render(); }
const requeue=w=>queue.splice(Math.min(queue.length,4),0,w);
function meta(){
  if(!cur){ $('left').textContent=''; return; }
  const t=today(); let d=0,n=0,k=0;
  for(const w of [cur,...queue]){ const r=srsOf(w); if(!r||r[0]===0) n++; else if(r[1]<=t) d++; else k++; }
  $('left').textContent=[d&&d+' da ripassare',n&&n+' da imparare',k&&k+' già sapute'].filter(Boolean).join(' · ');
}
// "Lo so" / "Ancora": if the card is still face down, show the translation for a second first
function act(kind){
  if(!cur) return;
  if(hold){ hold.go(); return; }          // tapping again skips the wait
  const w=cur, dir=st.dir;
  grade(w,kind==='yes',dir); updateScore(); renderCats();
  if(kind==='yes'){ const r=srsOf(w,dir); toast('«'+w.it+'» · ripasso '+inDays(r[1]-today()),{w,dir}); }
  const go=()=>{ if(kind==='no'&&cur===w) requeue(w); next(); };
  if(flipped){ go(); return; }
  flipped=true; render();
  const card=$('card'); card.classList.add(kind==='yes'?'hold-yes':'hold-no'); card.insertAdjacentHTML('beforeend','<div class="tick"></div>');
  if(st.dir==='de') speak(w.it);
  hold={go,timer:setTimeout(go,1000)};
}
function toast(msg,undo){
  $('toastMsg').textContent=msg; $('toastBtn').hidden=!undo; undoInfo=undo||null;
  $('toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ $('toast').hidden=true; undoInfo=null; },undo?5000:1600);
}
// undoing "Lo so" turns it into "Ancora": the word goes back to learning and returns in a few cards
function undoKnown(){
  if(!undoInfo) return; const {w,dir}=undoInfo;
  grade(w,false,dir); updateScore(); renderCats();
  if(hold&&cur===w){ clearTimeout(hold.timer); hold=null; requeue(w); next(); }
  else if(dir===st.dir&&pool().includes(w)&&!queue.includes(w)&&cur!==w){ requeue(w); if(cur) meta(); else next(); }
  toast('Annullato: «'+w.it+'» torna tra poco',null);
}
function render(){
  const s=$('stage');
  meta();
  if(!cur){
    const ws=pool(), t=today();
    let nd=Infinity; ws.forEach(w=>{ const r=srsOf(w); if(r&&r[0]>0&&r[1]>t&&r[1]<nd) nd=r[1]; });
    const nn=nd<Infinity?ws.filter(w=>{const r=srsOf(w); return r&&r[0]>0&&r[1]===nd;}).length:0;
    s.innerHTML='<div class="done"><h2>Per oggi è tutto!</h2><p class="empty">'+(!ws.length?'Nessuna parola.':
      'Hai già ripassato e imparato tutte le parole di questa scelta.'+(nn?'<br>Prossimo ripasso '+inDays(nd-t)+': '+nn+(nn===1?' parola.':' parole.'):''))+
      '</p><button class="link" id="again">Ripassa comunque tutte</button></div>';
    $('again').onclick=()=>{st.inc=true;$('incKnown').checked=true;save();build();};
    return;
  }
  const r=srsOf(cur), t=today();
  const mark=r&&r[0]>0?'<div class="knownmark">'+(r[1]<=t&&!hold?'↻ da ripassare':'✓ saputa · ripasso '+inDays(r[1]-t))+'</div>':'';
  const front = st.dir==='it' ? fmtIt(cur.it) : esc(cur.de);
  const back = st.dir==='it' ? esc(cur.de) : fmtIt(cur.it);
  s.innerHTML='<div class="card" id="card" tabindex="0" role="button" aria-label="Gira la scheda">'+

// Answer matching: every translation variant becomes a normalized key. Articles, accents,
// punctuation and parenthetical notes are ignored; "a, b; c" and "x/y" are separate answers.
const ART=/^(?:il|lo|la|i|gli|le|un|uno|una|der|die|das|den|dem|des|ein|eine|einen|einem|sich|si)\s+(?=\S)/;
const ART2=/^(?:l|un)['’](?=\S)/;
function key(s){
  s=s.toLowerCase().replace(/\([^)]*\)/g,' ').replace(/…|\.\.\./g,' * ').replace(/\s+/g,' ').trim();
  s=s.replace(ART2,'').replace(ART,'');
  s=s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
  return s.replace(/['’`´\-–.,;:!?¿¡"«»„“”]/g,'').replace(/\s+/g,' ').trim();
}
function answers(t){
  const out=new Set(), add=x=>{const k=key(x); if(k&&k!=='*') out.add(k);};
  for(const part of t.replace(/\([^)]*\)/g,' ').split(';')){
    const s=part.replace(/\s+/g,' ').trim(), phrase=/…|[.?!]$/.test(s), bases=[s];
    // "Gira a destra / a sinistra." → "Gira a destra", "Gira a sinistra."
    const sp=s.split(' / ');
    if(sp.length===2){ const lw=sp[0].split(' '), rw=sp[1].split(' '); if(rw.length<lw.length) bases.push(sp[0],lw.slice(0,lw.length-rw.length).concat(rw).join(' ')); }
    for(const base of bases){
      // "guten Morgen/Tag" → "guten Morgen", "guten Tag"
      let vs=[''];
      for(const tok of base.replace(/\s*\/\s*/g,'/').split(' ').filter(Boolean)){
        const opts=tok.includes('/')?tok.split('/').filter(Boolean):[tok], nx=[];
        for(const v of vs) for(const o of opts) nx.push(v?v+' '+o:o);
        vs=nx.slice(0,16);
      }
      vs.forEach(v=>{ add(v); if(!phrase) v.split(',').forEach(add); });
    }
  }
  return [...out];
}
// edit distance that counts a swap of two neighbouring letters as one typo
function lev(a,b){
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j;}
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[a.length][b.length];
}
const near=(k,c)=>{const tol=c.length>=12?2:c.length>=6?1:0; return tol>0&&k[0]===c[0]&&Math.abs(c.length-k.length)<=tol&&lev(k,c)<=tol;};
// "mi chiamo *" accepts "mi chiamo" and "mi chiamo emin"
const tmpl=(k,c)=>c.includes('*')&&new RegExp('^'+c.replace(/ /g,'').split('*').map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$').test(k.replace(/ /g,''));
// Speech recognizers often write numbers as digits ("18", "1.000", "1."), so for voice answers
// digits are also tried as words in the answer language ("achtzehn" / "diciotto", "erster" / "primo").
const DE1=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const DE10=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
const IT1=['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici','tredici','quattordici','quindici','sedici','diciassette','diciotto','diciannove'];
const IT10=['','','venti','trenta','quaranta','cinquanta','sessanta','settanta','ottanta','novanta'];
const ITORD=['','primo','secondo','terzo','quarto','quinto','sesto','settimo','ottavo','nono','decimo'];
const cross=(a,b)=>a.flatMap(x=>b.map(y=>x+y));
function numDe(n){
  if(n<20) return [DE1[n]];
  if(n<100){ const u=n%10, t=DE10[n/10|0]; return [u?(u===1?'ein':DE1[u])+'und'+t:t]; }
  if(n<1000){ const h=n/100|0, r=n%100; return cross(h===1?['hundert','einhundert']:[DE1[h]+'hundert'], r?numDe(r):['']); }
  if(n<1e6){ const k=n/1000|0, r=n%1000; return cross(k===1?['tausend','eintausend']:numDe(k).map(x=>x.replace(/eins$/,'ein')+'tausend'), r?numDe(r):['']); }
  return n===1e6?['eine Million']:n===1e9?['eine Milliarde']:[];
}
function numIt(n){
  if(n<20) return [IT1[n]];
  if(n<100){ const u=n%10; let t=IT10[n/10|0]; if(!u) return [t]; if(u===1||u===8) t=t.slice(0,-1); return [t+(u===3?'tré':IT1[u])]; }
  if(n<1000){ const h=n/100|0, r=n%100, c=h===1?'cento':IT1[h]+'cento'; return r?numIt(r).map(x=>(r>=80&&r<90?c.slice(0,-1):c)+x):[c]; }
  if(n<1e6){ const k=n/1000|0, r=n%1000; return cross(k===1?['mille']:numIt(k).map(x=>x+'mila'), r?numIt(r):['']); }
  return n===1e6?['un milione']:n===1e9?['un miliardo']:[];
}
const ordDe=n=>n===1?['erster','erste']:n===3?['dritter','dritte']:numDe(n).map(c=>c+(n<20?'ter':'ster')).concat(n===7?['siebter']:[]);
const ordIt=n=>n<=10?[ITORD[n]]:numIt(n).map(c=>c.replace(/[aeioué]$/,'')+'esimo');
function numForms(t,lang){
  if(!/\d/.test(t)) return [];
  t=t.replace(/(\d)[.,'’\s](?=\d{3}(?!\d))/g,'$1').replace(/(^|\s)1\s+(?=(?:million|milliarde|milione|miliardo)\b)/gi,'$1');
  let vs=[''];
  t.split(/(\d+[.°ºª]?)/).forEach((p,i)=>{
    let opts=[p];
    if(i%2){
      const n=+p.replace(/\D/g,''), w=(lang==='de'?numDe:numIt)(n).concat(/[.°ºª]$/.test(p)?(lang==='de'?ordDe:ordIt)(n):[]);
      if(w.length) opts=w.map(x=>' '+x+' ');
    }
    vs=cross(vs,opts).slice(0,24);
  });
  return vs;
}
// mode 0: exact while typing · 1: Enter (allows a typo) · 2: voice, interim · 3: voice, final
function matches(v,cands,mode,lang){
  if(!lang) lang=T&&T.dir==='de'?'it':'de';
  let parts=mode?[v].concat(v.split(/[,;\/]/)):[v];
  if(mode>=2) parts=parts.concat(numForms(v,lang));
  for(const p of parts){
    const k=key(p); if(!k) continue;
    if(cands.includes(k)) return true;
    for(const c of cands){
      if(tmpl(k,c)) return true;
      if((mode===1||mode===3)&&near(k,c)) return true;
      if(mode>=2&&c.length>1&&(' '+k+' ').includes(' '+c+' ')) return true;
    }
  }
  return false;
}

// voice answers: one short recognition session per word, restarted on every new word
let rec=null, recWant=false, quick=0;
function micOn(){ if(!SR||!T||T.over) return; recWant=true; quick=0; if(!rec) spawn(); }
function micOff(){ recWant=false; const r=rec; rec=null; if(r) try{r.abort();}catch(e){} $('sfMic').classList.remove('live'); }
function micNext(){
  if(!recWant) return;

}
function spawn(){
  if(!SR||!recWant||!T||T.over||rec) return;

  r.onstart=()=>{ if(rec===r) $('sfMic').classList.add('live'); };
  r.onresult=e=>{
    if(rec!==r||r.next||!T||T.over||T.cur!==word) return;
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i], alts=Array.from(res,a=>a.transcript.trim()).filter(Boolean);
      if(!alts.length) continue;
      $('sfHeard').textContent='«'+alts[0]+'»';
      if(alts.some(a=>matches(a,T.cands,2))){ correct(); return; }
      if(res.isFinal){ if(alts.some(a=>matches(a,T.cands,3))) correct(); else endRun(true,alts[0]); return; }
    }
  };

    if(rec!==r) return;

  };

    if(rec!==r) return; rec=null; $('sfMic').classList.remove('live');

    if(quick>4){ recWant=false; $('sfHeard').textContent='Riconoscimento vocale non disponibile'; return; }
    spawn();
  };
  try{ r.start(); }catch(e){ rec=null; }
}

const elapsed=()=>T?((T.over?T.pauseAt:performance.now())-T.t0-T.paused):0;

function initSfida(){

    // if a longer answer starts with what was typed ("l" vs "lo"), wait a moment before accepting
    if(T.cands.some(c=>c!==k&&c.startsWith(k))) acceptTimer=setTimeout(()=>{ if(T&&!T.over&&key(inp.value)===k) correct(); },650);
    else correct();
  });
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||e.isComposing) return; e.preventDefault();
    if(!T||T.over) return; const v=inp.value.trim(); if(!v) return;
    if(matches(v,T.cands,1)) correct(); else endRun(true,v);
  });
  $('sfStart').onclick=startRun;
  $('sfAgain').onclick=()=>{ if(T&&performance.now()-T.endAt<450) return; startRun(); };
  $('sfSkip').onclick=()=>endRun(true,null);
  $('sfStop').onclick=()=>endRun(false);
  $('sfOverride').onclick=()=>{
    if(!T||!T.over) return;
    if(T.entry){ const i=scores.indexOf(T.entry); if(i>=0){ scores.splice(i,1); saveScores(); } T.entry=null; }
    T.paused+=performance.now()-T.pauseAt; T.over=false;
    if(T.lapsed){ restore(T.lapsed,T.prev,T.dir); T.lapsed=null; updateScore(); renderCats(); }
    $('sfEnd').hidden=true; $('sfPlay').hidden=false;
    correct();
    if(st.mic&&SR) micOn(); else inp.focus();
  };
  $('sfBack').onclick=()=>{ T=null; clearInterval(clockTimer); $('sfRun').hidden=true; $('sfIntro').hidden=false; renderSfIntro(); };
  const toggleSound=()=>{ st.sound=!st.sound; save(); updToggles(); if(st.sound) audioOn(); };
  $('sfSnd').onclick=toggleSound; $('sfSnd2').onclick=toggleSound;
  $('sfVoice').onclick=()=>{ st.mic=!st.mic; save(); updToggles(); };
  $('sfMic').onclick=()=>{ st.mic=!st.mic; save(); updToggles(); if(st.mic){ inp.blur(); micOn(); } else { micOff(); inp.focus(); } };
  $('sfClear').onclick=()=>{ $('sfClearConfirm').hidden=false; };
  $('sfClearNo').onclick=()=>{ $('sfClearConfirm').hidden=true; };
  $('sfClearYes').onclick=()=>{ scores=[]; saveScores(); renderSfIntro(); };
  // the clock stops while the app is in the background
  document.addEventListener('visibilitychange',()=>{
    if(!T||T.over) return;
    if(document.hidden){ T.hiddenAt=performance.now(); micOff(); }
    else if(T.hiddenAt){ T.paused+=performance.now()-T.hiddenAt; T.hiddenAt=0; if(st.mic&&SR&&!$('v-sfida').hidden) micOn(); }
  });
  renderSfIntro();
}

/* ---- Aggiornamenti ---- */
// An installed home-screen app can keep running an old copy for a long time. The
// app-version meta tag is compared with the online copy at launch, when the app returns
// to the foreground, and on demand; a newer version is loaded via a fresh URL.
const APP_V=document.querySelector('meta[name="app-version"]').content;
const VER_RE=new RegExp('name="app-'+'version" content="([^"]+)"');
let lastCheck=0;
async function latestVersion(){
  const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  const m=(await r.text()).match(VER_RE); return m?m[1]:null;
}
function reloadTo(v){ try{sessionStorage.setItem('quaderno-upd',v);}catch(e){} location.replace(location.pathname+'?v='+encodeURIComponent(v)); }
async function checkUpdate(manual){
  lastCheck=Date.now();
  const msg=$('verMsg'); if(manual) msg.textContent='Controllo…';
  let v=null;
  try{ v=await latestVersion(); }catch(e){ if(manual) msg.textContent='Controllo non riuscito, sei offline?'; return; }
  if(!v||v===APP_V){ if(manual) msg.textContent='Aggiornata · versione '+APP_V; return; }
  let tried=null; try{ tried=sessionStorage.getItem('quaderno-upd'); }catch(e){}
  // never interrupt a running Sfida, and never reload twice for the same version on its own
  if(manual||(!(T&&!T.over)&&tried!==v)) reloadTo(v);
  else { $('updBtn').onclick=()=>reloadTo(v); $('updBar').hidden=false; }
}
function initUpdates(){
  $('verMsg').textContent='Versione '+APP_V;
  $('verCheck').onclick=()=>checkUpdate(true);
  if(/[?&]v=/.test(location.search)) try{ history.replaceState(null,'',location.pathname); }catch(e){}
  setTimeout(()=>checkUpdate(false),800);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-lastCheck>20000) checkUpdate(false); });
}

/* ---- Tabs ---- */
function show(v){
  if(v!=='sfida'&&T&&!T.over) endRun(false);
  ['impara','categorie','cerca','sfida'].forEach(x=>{$('v-'+x).hidden=x!==v;});
  document.querySelectorAll('nav button').forEach(b=>{ if(b.dataset.v===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  window.scrollTo(0,0);
  if(v==='cerca') setTimeout(()=>$('q').focus(),50);
  if(v==='sfida'&&!T) renderSfIntro();
  if(v==='impara'&&stale) build();   // Sfida changed which words are due or being relearned
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));

initImpara(); initSfida(); initUpdates();   // initImpara → setDir builds the score, categories and queue
$('q').dispatchEvent(new Event('input'));
</script>
